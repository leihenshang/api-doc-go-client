# 客户端 CI：与本地共用 scripts/check.sh（仓库暂无 git remote，接入后自动生效）
name: client-check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 安装 Playwright Chromium（无头，无需桌面依赖）
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # PR 跑冒烟（快）；主干/定时跑全量
      - name: 门禁（PR：静态 + 单测 + e2e @smoke）
        if: github.event_name == 'pull_request'
        run: bash scripts/check.sh --smoke

      - name: 门禁（全量：含全部 e2e 回归）
        if: github.event_name != 'pull_request'
        run: bash scripts/check.sh --full

      - name: 上传失败产物（trace / 截图 / 集合快照）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            .tmp/e2e-artifacts/**
            .tmp/e2e/run-*/**
          retention-days: 7
          if-no-files-found: ignore
