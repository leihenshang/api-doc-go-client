name: CI

# 与本地门禁同源：bash scripts/check.sh（gofmt → build → vet → 全量 -cover + 覆盖率下限
# → 关键包 -race → 前端 type-check → i18n → 模型契约）。
# e2e 不在默认门禁里（需要浏览器与构建产物），按需用 workflow_dispatch 的 mode 手动跑。
#
# 【已关闭自动触发】2026-10-17：push / pull_request 不再自动跑。
# 需要时在 GitHub Actions 页面手动 Run workflow，或把下面 on: 段落恢复为：
#   on:
#     push:
#       branches: [master, main]
#     pull_request:
#     workflow_dispatch: ...

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '门禁模式（fast / smoke / full）'
        required: false
        default: fast

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails v2 在 Linux 上链接 webkit2gtk，缺库时 go build 直接失败。
      - name: 安装 Wails 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 一键门禁
        run: bash scripts/check.sh --${{ github.event.inputs.mode || 'fast' }}
