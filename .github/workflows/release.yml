name: release

# 推送 v* tag 即自动出包：构建两个 deb（正式/开发）→ 发布到 GitHub Release。
# 版本号取自 tag 名，与 scripts/release.sh 写进 wails.json 的值一致（check-versions.sh 兜底）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # wails 在 Linux 构建需要 GTK + WebKitGTK（22.04 是 4.0 系列）
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: 安装 wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: 版本号一致性
        run: bash scripts/check-versions.sh

      - name: 构建 deb
        run: |
          cd frontend && npm ci && cd ..
          VERSION="${GITHUB_REF_NAME#v}" bash scripts/build-deb.sh

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/*.deb
          generate_release_notes: true
          fail_on_unmatched_files: true
